# Decisão 27: cada merge na main gera a imagem do painel no GitHub (ghcr.io).
# Auditoria 01/10 (I1): antes de publicar, roda a suíte completa (testes/painel/rodar.sh) com Postgres e Auth falso.
# Em PR, só os testes rodam (o resultado aparece no PR antes do merge). Imagem só da main.
# Se o segredo PORTAINER_WEBHOOK_PAINEL existir, o Portainer é avisado e atualiza o serviço sozinho.
name: Imagem do painel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-painel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          # Contêiner descartável, só acessível ao job: sem senha (evita alerta de segredo no repositório).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: painel_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/painel_teste
      CHROMIUM_PATH: /usr/bin/google-chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Testes do painel (16 etapas)
        run: bash testes/painel/rodar.sh

      - name: Capturas dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-testes
          path: testes/painel/saida
          if-no-files-found: ignore

  receptor-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          # Contêiner descartável, só acessível ao job: sem senha (evita alerta de segredo no repositório).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RECEPTOR_DB: postgres://postgres@localhost:5432/receptor_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do receptor do WhatsApp
        working-directory: servicos/receptor
        run: npm ci && npm test

  receptor-imagem:
    needs: receptor-testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Versão curta
        id: v
        run: echo "curta=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: servicos/receptor
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/mateushblima/crm_planee-receptor:latest
            ghcr.io/mateushblima/crm_planee-receptor:${{ steps.v.outputs.curta }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=receptor
          cache-to: type=gha,mode=max,scope=receptor

  imagem:
    needs: testes
    # Só a main publica: um disparo manual em outra branch não pode gerar "latest" (auditoria 01/10, I10).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Versão curta
        id: v
        run: echo "curta=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSAO=${{ steps.v.outputs.curta }}
          tags: |
            ghcr.io/mateushblima/crm_planee:latest
            ghcr.io/mateushblima/crm_planee:${{ steps.v.outputs.curta }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Avisar o Portainer
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_PAINEL }}
        if: env.WEBHOOK != ''
        run: curl -fsS -X POST "$WEBHOOK" && echo "Portainer avisado."

# Decisão 27: cada merge na main gera a imagem do painel no GitHub (ghcr.io).
# Se o segredo PORTAINER_WEBHOOK_PAINEL existir, o Portainer é avisado e atualiza o serviço sozinho.
name: Imagem do painel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-painel
  cancel-in-progress: false

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Versão curta
        id: v
        run: echo "curta=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSAO=${{ steps.v.outputs.curta }}
          tags: |
            ghcr.io/mateushblima/crm_planee:latest
            ghcr.io/mateushblima/crm_planee:${{ steps.v.outputs.curta }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Avisar o Portainer
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_PAINEL }}
        if: env.WEBHOOK != ''
        run: curl -fsS -X POST "$WEBHOOK" && echo "Portainer avisado."
